# glacier-seg: single config for all pipeline stages.
# Edit paths here, scripts read nothing from the command line except --config.

paths:
  # Relative paths resolve against the repo root (the folder holding this file).
  # Absolute paths are used as-is, e.g. to move training chips to a local SSD later.
  root: data
  raw_glamos: data/raw/glamos
  raw_image: data/raw/swissimage
  raw_dem: data/raw/swissalti3d
  manifest: data/manifest
  labels: data/labels          # Phase 1: rasterized label tiles
  chips: data/chips            # Phase 1: training chips (npz)

glamos:
  # CC BY 4.0, cite GLAMOS on every figure / README
  inventories:
    sgi2016: https://doi.glamos.ch/data/inventory/inventory_sgi2016_r2020.zip   # labels for training (2013-2018)
    sgi2023: https://doi.glamos.ch/data/inventory/inventory_sgi2023_r2026.zip   # independent test set (2021-2024)
    sgi2010: https://doi.glamos.ch/data/inventory/inventory_sgi2010_r2010.zip   # context only, no imagery pair
    sgi1973: https://doi.glamos.ch/data/inventory/inventory_sgi1973_r1976.zip   # context only
    sgi1850: https://doi.glamos.ch/data/inventory/inventory_sgi1850_r1992.zip   # context only
  # Filename / layer-name hints used to locate layers inside the extracted zips.
  # Run 01_fetch_glamos.py first and check manifest/glamos_layers.txt, then adjust if needed.
  outline_hint: glacier
  debris_hint: debris

stac:
  api: https://data.geo.admin.ch/api/stac/v0.9
  image_collection: ch.swisstopo.swissimage-dop10   # COG, assets 0.1 m and 2 m, EPSG:2056, 1 km tiles
  dem_collection: ch.swisstopo.swissalti3d          # COG, assets 0.5 m and 2 m
  image_gsd_source: 0.1      # asset to read from (COG overviews are used, full 0.1 m is never pulled)
  dem_gsd_source: 2.0

pilot:
  # Phase 0/1 works on a small, diverse set. Mix of clean ice and heavy debris cover.
  # Matched exactly against any text column of SGI2016 (sgi-id here).
  glaciers:            # SGI2016 sgi-id (unique); names are ambiguous (two Findelgletscher)
    - B36-26           # Grosser Aletschgletscher   78.5 km2  acq 2017
    - B43-03           # Rhonegletscher             14.6 km2  acq 2016
    - E22-03           # Vadret da Morteratsch      14.9 km2  acq 2015
    - A54g-11          # Unteraargletscher          22.7 km2  acq 2016  heavy debris
    - B57-05           # Zmuttgletscher             14.8 km2  acq 2016  heavy debris
    - B56-03           # Findelgletscher            13.9 km2  acq 2015
  buffer_m: 300              # context around the outline so the model sees rock / moraine too

raster:
  target_res_m: 0.5          # SWISSIMAGE over the Alps is ~25 cm effective; 0.5 m keeps margins sharp, 25x less data
  tile_size_m: 1000          # swisstopo grid
  dem_res_m: 2.0
  workers: 6                 # parallel HTTP reads

classes:
  0: background              # rock, vegetation, water, moraine
  1: clean_ice_firn          # glacier outline minus debris polygons
  2: debris_covered_ice      # SGI debris-cover polygons inside the outline
  255: ignore                # nodata / outside imagery

phase1:
  ignore_band_m: 10          # half-width of the ignore band around every class boundary (README 5.4)
  max_label_gap_years: 2     # image/label pairs with a larger gap are excluded from training
  chip_px: 512               # chip size at target_res_m -> 256 m on the ground
  chip_stride_px: 496        # 4x4 grid covers a 2000 px tile, 16 px overlap
  min_glacier_frac: 0.01     # keep a chip if >=1% of valid pixels are ice/debris...
  bg_keep_frac: 0.10         # ...else keep this deterministic share of pure-background chips as negatives
  qc_per_glacier: 4          # overlay PNGs per glacier for visual check
  # SGI2016 acquisition year per pilot glacier (inventory attribute, see README 5.1)
  acq_year:
    B36-26: 2017             # Grosser Aletschgletscher
    B43-03: 2016             # Rhonegletscher
    E22-03: 2015             # Vadret da Morteratsch
    A54g-11: 2016            # Unteraargletscher
    B57-05: 2016             # Zmuttgletscher
    B56-03: 2015             # Findelgletscher
  # Split by glacier, never by chip (README 5.4)
  split:
    train: [B36-26, B43-03, A54g-11, B56-03]
    val:   [B57-05]
    test:  [E22-03]

phase2:
  input_set: rgb             # rgb (3 ch) | rgb_terrain (5 ch: + elevation + slope); run both, compare IoU
  encoder: resnet34          # segmentation-models-pytorch encoder
  encoder_weights: imagenet  # null for offline / from-scratch runs
  epochs: 60
  batch_size: 8              # 512 px, fp16: ~6 GB on the P100 at 8; raise to 12 if it fits
  lr: 3.0e-4                 # AdamW, cosine decay to lr/50
  weight_decay: 1.0e-4
  dice_weight: 0.5           # loss = CE + dice_weight * Dice, both ignore class 255
  max_class_weight: 10.0     # cap for median-frequency class weights (debris would explode otherwise)
  augment: true              # flips, 90-deg rotations, brightness/contrast jitter on RGB
  amp: true                  # fp16 autocast; P100 runs fp16 at full rate
  num_workers: 4
  early_stop_patience: 12    # epochs without val mIoU improvement
  limit_train_batches: 0     # 0 = full epoch; small number = smoke test
  seed: 42
  models_dir: data/models    # resolved like paths.* (relative to repo root)

phase3:
  run: unet_resnet34_rgb_terrain   # trained run to use: models_dir/<run>/best.pt
  window_stride_px: 256            # 50% overlap; softmax averaged across windows
  batch_size: 16                   # inference windows per forward pass
  years: []                        # restrict to these image years; empty = every year in the manifest
  predictions_dir: data/predictions
  sgi2023_ignore_band_m: 10        # same boundary tolerance as training labels, for a fair score
